# Turnos de policlínica — Matías Nicolás Echeveste Cardozo
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release
      - name: Verificar que el modelo y las migraciones coinciden
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/Turnos.Api --no-build --configuration Release

  docker:
    runs-on: ubuntu-latest
    needs: pruebas
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t turnos-policlinica .
